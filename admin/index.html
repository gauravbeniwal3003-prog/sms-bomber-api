<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 SMS BOMBER — Full Features</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 14px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 1.5em;
            color: #1a1a2e;
            transition: 0.3s;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .menu-toggle:hover { background: rgba(255,255,255,0.5); transform: scale(1.05); }
        
        .sidebar {
            position: fixed;
            top: 0;
            left: -340px;
            width: 320px;
            height: 100vh;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(30px);
            border-right: 1px solid rgba(255,255,255,0.3);
            padding: 80px 20px 20px;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            box-shadow: 4px 0 40px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        .sidebar.open { left: 0; }
        .sidebar .tab {
            display: block;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 6px;
            border: none;
            border-radius: 12px;
            background: transparent;
            font-size: 1em;
            font-weight: 600;
            color: #1a1a2e;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
        }
        .sidebar .tab:hover { background: rgba(0,0,0,0.05); }
        .sidebar .tab.active { background: rgba(0,0,0,0.08); border-left: 4px solid #00cc44; }
        .sidebar .tab .icon { margin-right: 12px; }
        .sidebar .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.8em;
            cursor: pointer;
            color: #1a1a2e;
        }

        .glass {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            padding: 30px 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .header h1 { color: #1a1a2e; font-size: 2em; font-weight: 700; }
        .header span { color: #555; font-size: 0.85em; background: rgba(0,0,0,0.05); padding: 4px 14px; border-radius: 20px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .stat-card .number { font-size: 2em; font-weight: 700; color: #1a1a2e; }
        .stat-card .label { font-size: 0.8em; color: #555; }
        .stat-card .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .stat-card .status-dot.running { background: #00cc44; animation: pulse 1s infinite; }
        .stat-card .status-dot.stopped { background: #ff4444; }
        @keyframes pulse { 50% { opacity: 0.4; } }

        .row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .col { flex: 1; min-width: 240px; }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .input-group input, .input-group select {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 14px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
            font-size: 1em;
            color: #1a1a2e;
            outline: none;
            border: 1px solid rgba(255,255,255,0.3);
            min-width: 120px;
        }
        .input-group input:focus { background: rgba(255,255,255,0.85); }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .btn-start { background: #00cc44; color: #fff; box-shadow: 0 4px 15px rgba(0,204,68,0.3); }
        .btn-start:hover { background: #00b33a; transform: scale(1.02); }
        .btn-stop { background: #ff4444; color: #fff; box-shadow: 0 4px 15px rgba(255,68,68,0.3); }
        .btn-stop:hover { background: #e03333; transform: scale(1.02); }
        .btn-primary { background: #0066ff; color: #fff; box-shadow: 0 4px 15px rgba(0,102,255,0.3); }
        .btn-primary:hover { background: #0055dd; transform: scale(1.02); }
        .btn-danger { background: #ff4444; color: #fff; }
        .btn-danger:hover { background: #cc0000; }
        .btn-sm { padding: 6px 14px; font-size: 0.8em; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .request-list, .log-box, .key-list {
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .request-item, .key-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            color: #1a1a2e;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .request-item:last-child, .key-item:last-child { border-bottom: none; }
        .badge { background: #00cc44; color: #fff; font-size: 0.7em; padding: 2px 10px; border-radius: 12px; }
        .badge-warning { background: #ff6600; color: #fff; font-size: 0.7em; padding: 2px 10px; border-radius: 12px; }
        .badge-danger { background: #ff4444; color: #fff; font-size: 0.7em; padding: 2px 10px; border-radius: 12px; }

        .log-box { height: 160px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.8em; }
        .log-box div { padding: 3px 0; border-bottom: 1px solid rgba(0,0,0,0.03); }
        .key-code { font-family: monospace; font-size: 0.85em; background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 6px; }
        .copy-btn { background: none; border: none; cursor: pointer; font-size: 1.1em; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .settings-grid .full { grid-column: 1 / -1; }

        @media (max-width: 600px) {
            .glass { padding: 20px; }
            .header h1 { font-size: 1.4em; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .sidebar { width: 280px; left: -300px; }
            .settings-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<div class="sidebar" id="sidebar">
    <button class="close-btn" onclick="toggleMenu()">✕</button>
    <button class="tab active" data-tab="tab1" onclick="switchTab('tab1')"><span class="icon">🚀</span> Dashboard</button>
    <button class="tab" data-tab="tab2" onclick="switchTab('tab2')"><span class="icon">🔑</span> API Keys</button>
    <button class="tab" data-tab="tab3" onclick="switchTab('tab3')"><span class="icon">📜</span> Logs</button>
    <button class="tab" data-tab="tab4" onclick="switchTab('tab4')"><span class="icon">📊</span> Key History</button>
</div>

<div class="glass">

    <!-- TAB 1: DASHBOARD -->
    <div id="tab1" class="tab-content active">
        <div class="header"><h1>💀 SMS BOMBER</h1><span>⚡ Full Features · @gaurav_beniwal_0001</span></div>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="number" id="totalRequests">0</div><div class="label">📦 Total Sent</div></div>
            <div class="stat-card"><div class="number" id="successCount">0</div><div class="label">✅ Success</div></div>
            <div class="stat-card"><div class="number" id="failedCount">0</div><div class="label">❌ Failed</div></div>
            <div class="stat-card"><div class="number"><span class="status-dot" id="statusDot"></span><span id="statusText">Stopped</span></div><div class="label">⚡ Status</div></div>
        </div>
        <div class="row">
            <div class="col">
                <div class="input-group">
                    <input type="text" id="targetPhone" placeholder="📱 Phone" value="9729480795">
                    <input type="text" id="apiKeyInput" placeholder="🔑 API Key (optional)" style="flex:0.8;">
                    <button class="btn btn-start" id="startBtn" onclick="startBomb()">🚀 START</button>
                    <button class="btn btn-stop" id="stopBtn" onclick="stopBomb()" style="display:none;">⏹️ STOP</button>
                </div>
                <div id="bombStatus" style="margin-top:12px;font-weight:500;color:#1a1a2e;"></div>
            </div>
            <div class="col">
                <div class="request-list" id="requestList"><div style="color:#888;">Loading...</div></div>
            </div>
        </div>
        <div style="margin-top:20px;"><div class="log-box" id="logBox"></div></div>
    </div>

    <!-- TAB 2: API KEYS -->
    <div id="tab2" class="tab-content">
        <h2 style="color:#1a1a2e;margin-bottom:15px;">🔑 API Key Management</h2>
        
        <div style="background:rgba(255,255,255,0.3);border-radius:16px;padding:20px;margin-bottom:20px;">
            <h3 style="color:#1a1a2e;margin-bottom:12px;">➕ Generate New Key</h3>
            <div class="settings-grid">
                <div><label style="color:#555;">Key Name</label><input type="text" id="keyName" placeholder="My Key" style="width:100%;padding:10px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);"></div>
                <div><label style="color:#555;">Custom Key (optional)</label><input type="text" id="customKey" placeholder="my_custom_key_123" style="width:100%;padding:10px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);"></div>
                <div><label style="color:#555;">Expiry Type</label>
                    <select id="expiryType" style="width:100%;padding:10px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);">
                        <option value="unlimited">♾️ Unlimited</option>
                        <option value="time">⏱️ Time Based</option>
                        <option value="date">📅 Date Based</option>
                    </select>
                </div>
                <div id="expirySettings">
                    <label style="color:#555;">Duration (seconds) / Date</label>
                    <input type="text" id="expiryValue" placeholder="3600 or 2026-12-31T23:59:59" style="width:100%;padding:10px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);">
                </div>
                <div><label style="color:#555;">Request Limit (0 = unlimited)</label><input type="number" id="requestLimit" value="0" style="width:100%;padding:10px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);"></div>
                <div style="display:flex;align-items:flex-end;"><button class="btn btn-start" onclick="generateKey()" style="width:100%;">🔑 Generate Key</button></div>
            </div>
        </div>

        <h3 style="color:#1a1a2e;margin:15px 0 10px;">📋 Existing Keys</h3>
        <div class="key-list" id="keyList"><div style="color:#888;">Loading...</div></div>
    </div>

    <!-- TAB 3: LOGS -->
    <div id="tab3" class="tab-content">
        <h2 style="color:#1a1a2e;margin-bottom:15px;">📜 Live Logs</h2>
        <div class="log-box" id="logBoxTab3" style="height:400px;"></div>
    </div>

    <!-- TAB 4: KEY HISTORY -->
    <div id="tab4" class="tab-content">
        <h2 style="color:#1a1a2e;margin-bottom:15px;">📊 Key History</h2>
        <div id="historyList" style="color:#1a1a2e;"></div>
    </div>

</div>

<script>
const API_BASE = window.location.origin + '/api';

// ===== MENU =====
function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active');
    if (tabId === 'tab2') loadKeys();
    if (tabId === 'tab3') loadLogs();
    if (tabId === 'tab4') loadHistory();
    toggleMenu();
}

// ===== DOM REFS =====
const $ = id => document.getElementById(id);
const totalRequests = $('totalRequests'), successCount = $('successCount'), failedCount = $('failedCount');
const statusDot = $('statusDot'), statusText = $('statusText'), startBtn = $('startBtn'), stopBtn = $('stopBtn');
const bombStatus = $('bombStatus'), logBox = $('logBox'), targetPhone = $('targetPhone'), requestList = $('requestList');

// ===== LOAD DATA =====
async function loadStats() {
    try {
        const res = await fetch(API_BASE + '/stats');
        const data = await res.json();
        totalRequests.textContent = data.usage?.total_requests || 0;
        successCount.textContent = data.usage?.success || 0;
        failedCount.textContent = data.usage?.failed || 0;
    } catch(e) {}
}

async function loadRequests() {
    try {
        const res = await fetch(API_BASE + '/requests');
        const data = await res.json();
        if (!data || data.length === 0) { requestList.innerHTML = '<div style="color:#888;">No requests.</div>'; return; }
        requestList.innerHTML = data.filter(r => r.active).map(req => `
            <div class="request-item"><span>✅ ${req.name}</span><span class="badge">${req.method}</span></div>
        `).join('') || '<div style="color:#888;">No active requests.</div>';
    } catch(e) {}
}

async function loadStatus() {
    try {
        const res = await fetch(API_BASE + '/bomb/status');
        const data = await res.json();
        if (data.active) {
            statusDot.className = 'status-dot running';
            statusText.textContent = 'Running';
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            bombStatus.innerHTML = `🟢 <strong>Bombing active</strong> · ${data.threads || 0} threads · ${data.stats?.total_requests || 0} sent`;
        } else {
            statusDot.className = 'status-dot stopped';
            statusText.textContent = 'Stopped';
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            bombStatus.innerHTML = data.stats ? `⏹️ Stopped · ${data.stats.total_requests || 0} sent` : '⏹️ Idle';
        }
    } catch(e) {}
}

// ===== BOMBING =====
async function startBomb() {
    const phone = targetPhone.value.trim();
    if (!phone) { alert('Enter phone number!'); return; }
    const api_key = document.getElementById('apiKeyInput').value.trim();
    startBtn.disabled = true; startBtn.textContent = '⏳ Starting...';
    try {
        const body = {phone};
        if (api_key) body.api_key = api_key;
        const res = await fetch(API_BASE + '/bomb/start', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
            addLog(`🚀 Bombing started on ${phone} · ${data.threads} threads`);
            await loadStatus(); await loadStats();
        } else { alert('❌ ' + (data.error || 'Failed')); }
    } catch(e) { alert('❌ Error: ' + e.message); }
    startBtn.disabled = false; startBtn.textContent = '🚀 START';
}

async function stopBomb() {
    stopBtn.disabled = true; stopBtn.textContent = '⏳ Stopping...';
    try {
        const res = await fetch(API_BASE + '/bomb/stop', { method: 'POST', headers: {'Content-Type':'application/json'} });
        const data = await res.json();
        if (data.success) {
            addLog(`⏹️ Bombing stopped · ${data.stats.total_requests} sent`);
            await loadStatus(); await loadStats();
        }
    } catch(e) {}
    stopBtn.disabled = false; stopBtn.textContent = '⏹️ STOP';
}

// ===== KEYS =====
async function loadKeys() {
    try {
        const res = await fetch(API_BASE + '/keys');
        const data = await res.json();
        const container = document.getElementById('keyList');
        if (!data || Object.keys(data).length === 0) {
            container.innerHTML = '<div style="color:#888;">No keys generated.</div>';
            return;
        }
        container.innerHTML = Object.entries(data).map(([key, val]) => `
            <div class="key-item">
                <span class="key-code">${key}</span>
                <span>${val.name || 'Unnamed'}</span>
                <span>${val.expiry_type || 'unlimited'} ${val.expiry_time ? '· ' + new Date(val.expiry_time).toLocaleDateString() : ''}</span>
                <span>${val.request_limit || 0 > 0 ? `${val.used || 0}/${val.request_limit}` : '♾️ Unlimited'}</span>
                <span>
                    <button class="copy-btn" onclick="copyKey('${key}')" title="Copy">📋</button>
                    <button class="btn btn-danger btn-sm" onclick="revokeKey('${key}')">✕</button>
                </span>
            </div>
        `).join('');
    } catch(e) {}
}

async function generateKey() {
    const name = document.getElementById('keyName').value || 'Unnamed';
    const custom_key = document.getElementById('customKey').value.trim();
    const expiry_type = document.getElementById('expiryType').value;
    const expiry_value = document.getElementById('expiryValue').value.trim();
    const request_limit = parseInt(document.getElementById('requestLimit').value) || 0;
    
    const data = {name, custom_key, expiry_type, request_limit};
    if (expiry_type === 'time') data.duration = parseInt(expiry_value) || 3600;
    if (expiry_type === 'date') data.expiry_date = expiry_value;
    
    try {
        const res = await fetch(API_BASE + '/keys', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.success) {
            alert('✅ Key Generated: ' + result.key);
            loadKeys();
            loadHistory();
        } else {
            alert('❌ ' + (result.error || 'Failed'));
        }
    } catch(e) { alert('❌ Error: ' + e.message); }
}

async function revokeKey(key) {
    if (!confirm('Revoke key: ' + key + '?')) return;
    try {
        await fetch(API_BASE + '/keys/' + key, { method: 'DELETE' });
        loadKeys();
        loadHistory();
    } catch(e) {}
}

function copyKey(key) {
    navigator.clipboard.writeText(key).then(() => {
        alert('✅ Copied: ' + key);
    }).catch(() => {
        // Fallback
        const textarea = document.createElement('textarea');
        textarea.value = key;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('✅ Copied: ' + key);
    });
}

// ===== LOGS =====
async function loadLogs() {
    try {
        const res = await fetch(API_BASE + '/logs?limit=100');
        const data = await res.json();
        const container = document.getElementById('logBoxTab3');
        container.innerHTML = data.map(log => `
            <div>[${new Date(log.time).toLocaleTimeString()}] ${log.request} · ${log.phone} · ${log.status}</div>
        `).join('') || '<div style="color:#888;">No logs yet.</div>';
    } catch(e) {}
}

// ===== HISTORY =====
async function loadHistory() {
    try {
        const res = await fetch(API_BASE + '/keys/history');
        const data = await res.json();
        const container = document.getElementById('historyList');
        if (!data || data.length === 0) {
            container.innerHTML = '<div style="color:#888;">No history yet.</div>';
            return;
        }
        container.innerHTML = data.slice().reverse().map(h => `
            <div class="request-item">
                <span>${h.action || 'used'}</span>
                <span class="key-code">${h.key}</span>
                <span>${h.name || '-'}</span>
                <span>${h.request_limit ? h.request_limit + ' limit' : '♾️'}</span>
                <span>${new Date(h.time).toLocaleString()}</span>
            </div>
        `).join('');
    } catch(e) {}
}

// ===== LOGS MAIN =====
function addLog(msg) {
    const entry = document.createElement('div');
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.prepend(entry);
    if (logBox.children.length > 50) logBox.removeChild(logBox.lastChild);
}

// ===== EXPIRY TYPE TOGGLE =====
document.getElementById('expiryType').addEventListener('change', function() {
    const label = document.querySelector('#expirySettings label');
    const input = document.getElementById('expiryValue');
    if (this.value === 'time') {
        label.textContent = '⏱️ Duration (seconds):';
        input.placeholder = '3600';
    } else if (this.value === 'date') {
        label.textContent = '📅 Expiry Date (YYYY-MM-DDTHH:MM:SS):';
        input.placeholder = '2026-12-31T23:59:59';
    } else {
        label.textContent = '♾️ Unlimited (no expiry)';
        input.placeholder = 'Unlimited';
        input.value = '';
    }
});

// ===== POLLING =====
setInterval(async () => { await loadStats(); await loadStatus(); }, 1500);

// ===== INIT =====
loadRequests(); loadStats(); loadStatus(); loadKeys(); loadLogs(); loadHistory();
addLog('💀 Full Features Admin ready · All server-side');
</script>
</body>
</html>
