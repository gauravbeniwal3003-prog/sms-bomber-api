<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 SMS BOMBER ADMIN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #00ff00; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { border-bottom: 2px solid #00ff00; padding-bottom: 10px; margin-bottom: 20px; }
        .header h1 { color: #ff0000; font-size: 2em; }
        .header span { color: #888; font-size: 0.8em; }
        .card { background: #111; border: 1px solid #333; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 300px; }
        input, select { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #00ff00; border-radius: 5px; font-family: monospace; font-size: 1em; }
        button { padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1.2em; }
        .btn-success { background: #00cc44; color: #fff; }
        .btn-success:hover { background: #009933; }
        .btn-danger { background: #ff0000; color: #fff; }
        .btn-danger:hover { background: #cc0000; }
        .btn-warning { background: #ff6600; color: #fff; }
        .btn-warning:hover { background: #cc5500; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .stat-box { background: #1a1a1a; padding: 15px; border-radius: 5px; text-align: center; }
        .stat-box .number { font-size: 2.5em; color: #ff6600; }
        .stat-box .label { color: #888; font-size: 0.8em; }
        .request-item { background: #1a1a1a; padding: 10px 15px; margin-bottom: 5px; border-radius: 5px; border-left: 3px solid #00ff00; }
        #log { background: #0a0a0a; padding: 10px; border-radius: 5px; height: 200px; overflow-y: auto; font-size: 0.8em; font-family: monospace; }
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 0.7em; }
        .status-badge.active { background: #00cc44; color: #000; }
        .status-badge.inactive { background: #ff0000; color: #fff; }
        .status-badge.running { background: #ff6600; color: #fff; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>💀 DEVILS WILL RISE — SMS BOMBER</h1>
        <span>Owner: @gaurav_beniwal_0001 | Channel: @gaurav_beni_0001</span>
    </div>

    <!-- Stats -->
    <div class="card">
        <h3>📊 SYSTEM STATS</h3>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-box"><div class="number" id="totalRequests">0</div><div class="label">Total Requests</div></div>
            <div class="stat-box"><div class="number" id="activeRequests">0</div><div class="label">Active Requests</div></div>
            <div class="stat-box"><div class="number" id="successCount">0</div><div class="label">Success</div></div>
            <div class="stat-box"><div class="number" id="failedCount">0</div><div class="label">Failed</div></div>
        </div>
    </div>

    <div class="row">
        <!-- Target & Controls -->
        <div class="col">
            <div class="card">
                <h3>🎯 TARGET & CONTROLS</h3>
                <input type="text" id="targetPhone" placeholder="Enter phone number" style="font-size:1.2em;">
                <br><br>
                <div style="display: flex; gap: 10px;">
                    <button onclick="startBomb()" class="btn-success" id="startBtn" style="flex:1;">🚀 START</button>
                    <button onclick="stopBomb()" class="btn-danger" id="stopBtn" style="flex:1; display:none;">⏹️ STOP</button>
                </div>
                <div id="bombStatus" style="margin-top:10px; font-size:1.1em;"></div>
            </div>
        </div>

        <!-- Active Requests -->
        <div class="col">
            <div class="card">
                <h3>📋 ACTIVE REQUESTS</h3>
                <div id="requestList"></div>
            </div>
        </div>
    </div>

    <!-- Logs -->
    <div class="card">
        <h3>📜 LIVE LOGS</h3>
        <div id="log"></div>
    </div>
</div>

<script>
const API_BASE = window.location.origin + '/api';

// ===== LOAD DATA =====
async function loadStats() {
    try {
        const res = await fetch(API_BASE + '/stats');
        const data = await res.json();
        document.getElementById('totalRequests').textContent = data.total_requests || 0;
        document.getElementById('activeRequests').textContent = data.active_requests || 0;
        document.getElementById('successCount').textContent = data.usage?.success || 0;
        document.getElementById('failedCount').textContent = data.usage?.failed || 0;
    } catch(e) {}
}

async function loadRequests() {
    try {
        const res = await fetch(API_BASE + '/requests');
        const data = await res.json();
        renderRequests(data);
    } catch(e) {}
}

function renderRequests(requests) {
    const container = document.getElementById('requestList');
    if (!requests || requests.length === 0) {
        container.innerHTML = '<p style="color:#888;">No requests configured.</p>';
        return;
    }
    container.innerHTML = requests.filter(r => r.active).map(req => `
        <div class="request-item">✅ ${req.name} | ${req.method} | ${req.url}</div>
    `).join('');
}

// ===== BOMBING =====
async function startBomb() {
    const phone = document.getElementById('targetPhone').value.trim();
    if (!phone) { alert('Enter phone number!'); return; }

    try {
        const res = await fetch(API_BASE + '/bomb/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({phone})
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            document.getElementById('bombStatus').innerHTML = `🟢 <strong>BOMBING ACTIVE</strong> on ${phone} | ${data.active_requests} requests`;
            addLog(`🚀 Bombing started on ${phone}`);
            loadStats();
        } else {
            alert('❌ ' + (data.error || 'Failed'));
        }
    } catch(e) { alert('❌ Error: ' + e.message); }
}

async function stopBomb() {
    try {
        const res = await fetch(API_BASE + '/bomb/stop', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('bombStatus').innerHTML = `⏹️ <strong>STOPPED</strong> | ${data.stats.total_requests} requests sent`;
            addLog(`⏹️ Bombing stopped`);
            loadStats();
        }
    } catch(e) {}
}

// ===== LOGS =====
function addLog(msg) {
    const log = document.getElementById('log');
    const entry = document.createElement('div');
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    log.prepend(entry);
    if (log.children.length > 50) log.removeChild(log.lastChild);
}

// ===== AUTO REFRESH =====
setInterval(() => {
    loadStats();
    // Check bombing status
    fetch(API_BASE + '/bomb/status').then(res => res.json()).then(data => {
        if (data.active) {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            document.getElementById('bombStatus').innerHTML = `🟢 <strong>BOMBING ACTIVE</strong> | ${data.active_requests} requests`;
        }
    }).catch(() => {});
}, 3000);

// ===== INIT =====
loadRequests();
loadStats();
addLog('💀 Admin panel ready');
</script>
</body>
</html>
