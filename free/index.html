<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>💀 FREE OTP BOMBER — Liquid Glass</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .glass {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 60px rgba(0,0,0,0.12);
            padding: 28px 24px 32px;
            transition: all 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .header h1 {
            color: #1a1a2e;
            font-size: 1.7em;
            font-weight: 700;
        }
        .header .badge {
            background: rgba(0,204,68,0.15);
            color: #00cc44;
            font-size: 0.65em;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .sub {
            color: #555;
            font-size: 0.8em;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 12px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .stat-card .num {
            font-size: 1.8em;
            font-weight: 700;
            color: #1a1a2e;
        }
        .stat-card .label {
            font-size: 0.6em;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 8px 14px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.running {
            background: #00cc44;
            animation: pulse 0.8s infinite;
        }
        .status-dot.stopped { background: #ff4444; }
        @keyframes pulse { 50% { opacity: 0.3; } }
        .status-text {
            font-weight: 500;
            color: #1a1a2e;
            font-size: 0.95em;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            font-size: 1em;
            color: #1a1a2e;
            outline: none;
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.3s;
            margin-bottom: 12px;
        }
        input:focus { background: rgba(255,255,255,0.8); }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .btn-start {
            background: #00cc44;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,204,68,0.25);
        }
        .btn-start:hover { background: #00b33a; transform: scale(1.01); }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-stop {
            background: #ff4444;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255,68,68,0.25);
            display: none;
        }
        .btn-stop:hover { background: #cc0000; transform: scale(1.01); }

        .log-box {
            background: rgba(0,0,0,0.04);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 12px 14px;
            height: 180px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.75em;
            color: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.15);
            margin-bottom: 12px;
        }
        .log-box div {
            padding: 3px 0;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            word-break: break-all;
        }
        .log-box .log-success { color: #00aa33; }
        .log-box .log-fail { color: #cc3333; }
        .log-box .log-info { color: #3366cc; }

        .footer {
            text-align: center;
            font-size: 0.65em;
            color: #777;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 12px;
        }
        .footer a {
            color: #1a1a2e;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .glass { padding: 20px 16px; }
            .header h1 { font-size: 1.3em; }
            .stat-card .num { font-size: 1.4em; }
            .btn { font-size: 0.9em; padding: 12px 0; }
            .log-box { height: 140px; font-size: 0.7em; }
        }
    </style>
</head>
<body>

<div class="glass" id="app">
    <div class="header">
        <h1>💀 FREE BOMBER</h1>
        <span class="badge">⚡ LOCAL DEVICE</span>
    </div>
    <div class="sub">🔹 Unlimited speed · No server timeout · Runs on your device</div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card"><div class="num" id="totalCount">0</div><div class="label">Total</div></div>
        <div class="stat-card"><div class="num" id="successCount">0</div><div class="label">✅ Success</div></div>
        <div class="stat-card"><div class="num" id="failedCount">0</div><div class="label">❌ Failed</div></div>
    </div>

    <!-- Status -->
    <div class="status-row">
        <span class="status-dot stopped" id="statusDot"></span>
        <span class="status-text" id="statusText">Stopped</span>
        <span style="margin-left:auto;font-size:0.7em;color:#888;" id="speedDisplay">0 req/sec</span>
    </div>

    <!-- Input -->
    <input type="text" id="targetPhone" placeholder="📱 Enter phone number" value="9729480795" />

    <!-- Buttons -->
    <div class="btn-group">
        <button class="btn btn-start" id="startBtn" onclick="startBomb()">🚀 START</button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopBomb()">⏹️ STOP</button>
    </div>

    <!-- Logs -->
    <div class="log-box" id="logBox">
        <div class="log-info">💀 Ready. Enter number and click START.</div>
    </div>

    <div class="footer">
        Owner: <a href="https://t.me/gaurav_beniwal_0001" target="_blank">@gaurav_beniwal_0001</a> · 
        <a href="https://www.youtube.com/@gaurav_beniwal_0001" target="_blank">YouTube</a>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
