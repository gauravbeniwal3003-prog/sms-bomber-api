<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>💀 FREE OTP BOMBER — Local Device</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .glass {
            max-width: 700px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        h1 { color: #ff0000; font-size: 2.2em; margin-bottom: 10px; }
        .sub { color: #888; font-size: 0.8em; margin-bottom: 30px; }
        input, button {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #111;
            color: #00ff00;
            font-size: 1.1em;
            font-family: monospace;
        }
        input:focus { outline: none; border-color: #00ff00; }
        .btn-start { background: #00cc44; color: #000; font-weight: bold; cursor: pointer; border: none; }
        .btn-start:hover { background: #00b33a; }
        .btn-stop { background: #ff4444; color: #fff; font-weight: bold; cursor: pointer; border: none; display: none; }
        .btn-stop:hover { background: #cc0000; }
        .log-box {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            font-size: 0.8em;
            margin-top: 15px;
        }
        .log-box div { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .stat-card {
            background: #111;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #222;
        }
        .stat-card .num { font-size: 1.8em; color: #ff6600; }
        .stat-card .label { color: #888; font-size: 0.7em; }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-dot.running { background: #00cc44; animation: blink 0.8s infinite; }
        .status-dot.stopped { background: #ff4444; }
        @keyframes blink { 50% { opacity: 0.3; } }
        .footer { margin-top: 20px; color: #555; font-size: 0.7em; text-align: center; }
    </style>
</head>
<body>

<div class="glass">
    <h1>💀 FREE OTP BOMBER</h1>
    <div class="sub">⚡ Local Device · Unlimited Speed · No Server Timeout</div>

    <div class="stats">
        <div class="stat-card"><div class="num" id="totalCount">0</div><div class="label">Total</div></div>
        <div class="stat-card"><div class="num" id="successCount">0</div><div class="label">✅ Success</div></div>
        <div class="stat-card"><div class="num" id="failedCount">0</div><div class="label">❌ Failed</div></div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <span class="status-dot stopped" id="statusDot"></span>
        <span id="statusText" style="color:#888;">Stopped</span>
    </div>

    <input type="text" id="targetPhone" placeholder="📱 Enter phone number" value="9729480795" />

    <button class="btn-start" id="startBtn" onclick="startBomb()">🚀 START BOMBING</button>
    <button class="btn-stop" id="stopBtn" onclick="stopBomb()">⏹️ STOP</button>

    <div class="log-box" id="logBox">
        <div>💀 Ready. Enter number and click START.</div>
    </div>

    <div class="footer">Owner: @gaurav_beniwal_0001 | Channel: @gaurav_beni_0001</div>
</div>

<script src="script.js"></script>
</body>
</html>
